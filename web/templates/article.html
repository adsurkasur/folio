<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Article.Title}}</title>
    <meta property="og:title" content="{{.Article.Title}}">
    <meta property="og:site_name" content="Folio">
    <meta property="og:description" content="By {{.Article.AuthorName}}">
    <meta property="og:type" content="article">
    {{if .Article.OGImageURL}}
    <meta property="og:image" content="{{.Article.OGImageURL}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{.Article.OGImageURL}}">
    {{end}}
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27black%27/%3E%3Ctext x=%2750%27 y=%2775%27 font-family=%27serif%27 font-style=%27italic%27 font-size=%2780%27 fill=%27white%27 text-anchor=%27middle%27%3E%C6%92%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/folio.css?v=14">
</head>
<body>
    <div class="folio-container">
        <main>
            <div class="folio-top-row">
                <div class="folio-inputs">
                    <h1 class="folio-title" style="margin-bottom: 8px;">{{.Article.Title}}</h1>
                    <div class="folio-author" style="margin-bottom: 20px;">
                        {{.Article.AuthorName}} &middot; <span>{{.Article.ViewsCount}} views</span> &middot; <span>{{.Article.CreatedAt.Format "Jan 02, 2006"}}</span>
                    </div>
                </div>
                {{if .CanEdit}}
                <div class="folio-actions" style="flex-direction: row; gap: 10px; position: relative;">
                    <a href="/edit/{{.Article.Slug}}" class="folio-btn" style="text-decoration: none;  display: inline-block; text-align: center;">EDIT</a>
                    <button id="btnDelete" onclick="showConfirm()" class="folio-btn" style="color: #ff4d4d; border-color: #ff4d4d;">DELETE</button>

                        <span style="font-size:14px; font-family:var(--ui-font); color:var(--text-color); text-align:center;">Delete forever?</span>
                        <div style="display:flex; gap:10px; justify-content:center;">
                            <button onclick="hideConfirm()" class="folio-btn" style="padding:4px 12px; font-size:12px;">Cancel</button>
                            <button onclick="deleteArticle('{{.Article.Slug}}')" class="folio-btn" style="padding:4px 12px; font-size:12px; color: #ff4d4d; border-color: #ff4d4d;">Delete</button>
                        </div>
                    </div>
                </div>
                {{end}}
            </div>
            
            <div class="folio-canvas">
                {{.Article.ContentHTML}}
            </div>
        </main>
    </div>
    <script>
        function showConfirm() {
            document.getElementById('confirmDelete').style.display = 'flex';
            document.getElementById('btnDelete').style.visibility = 'hidden';
        }
        function hideConfirm() {
            document.getElementById('confirmDelete').style.display = 'none';
            document.getElementById('btnDelete').style.visibility = 'visible';
        }
        async function deleteArticle(slug) {
            const res = await fetch('/api/articles/' + slug, { method: 'DELETE' });
            if(res.ok) window.location.href = '/';
        }
    </script>
</body>
</html>
