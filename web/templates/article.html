<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Folio</title>
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:site_name" content="Folio">
    <meta property="og:description" content="By {{.Author}}">
    <meta property="og:type" content="article">
    {{if .Thumbnail}}
    <meta property="og:image" content="{{.Thumbnail}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{.Thumbnail}}">
    {{end}}
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
    <link rel="stylesheet" href="/static/folio.css?v=3">
</head>
<body>
    <div class="folio-container">
        {{if .CanEdit}}
        <header class="folio-header">
            <a href="/edit/{{.Slug}}" class="folio-btn" style="margin-right: 10px; text-decoration: none;">EDIT</a>
            <button onclick="deleteArticle('{{.Slug}}')" class="folio-btn" style="color: #ff4444; border-color: #ff4444;">DELETE</button>
        </header>
        {{end}}

        <main>
            <h1 class="folio-title" style="margin-bottom: 0;">{{.Title}}</h1>
            <div class="folio-author" style="margin-bottom: 30px;">
                {{.Author}} &middot; <span>{{.Views}} views</span> &middot; <span>{{.Date}}</span>
            </div>
            
            <div class="folio-canvas">
                {{.ContentHTML}}
            </div>
        </main>
    </div>
    <script>
        async function deleteArticle(slug) {
            if(!confirm('Delete this article forever?')) return;
            const res = await fetch('/api/articles/' + slug, { method: 'DELETE' });
            if(res.ok) window.location.href = '/';
        }
    </script>
</body>
</html>
