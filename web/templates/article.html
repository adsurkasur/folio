<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Folio</title>
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:site_name" content="Folio">
    <meta property="og:description" content="By {{.Author}}">
    <meta property="og:type" content="article">
    {{if .Thumbnail}}
    <meta property="og:image" content="{{.Thumbnail}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{.Thumbnail}}">
    {{end}}
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27black%27/%3E%3Ctext x=%2750%27 y=%2775%27 font-family=%27serif%27 font-style=%27italic%27 font-size=%2780%27 fill=%27white%27 text-anchor=%27middle%27%3E%C6%92%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/folio.css?v=6">
</head>
<body>
    <div class="folio-container">
        <main>
            <div class="folio-top-row">
                <div class="folio-inputs">
                    <h1 class="folio-title" style="margin-bottom: 8px;">{{.Title}}</h1>
                    <div class="folio-author" style="margin-bottom: 20px;">
                        {{.Author}} &middot; <span>{{.Views}} views</span> &middot; <span>{{.Date}}</span>
                    </div>
                </div>
                {{if .CanEdit}}
                <div class="folio-actions">
                    <a href="/edit/{{.Slug}}" class="folio-btn" style="text-decoration: none; margin-bottom: 10px; display: inline-block; text-align: center;">EDIT</a>
                    <button onclick="deleteArticle('{{.Slug}}')" class="folio-btn" style="color: #ff4d4d; border-color: #ff4d4d;">DELETE</button>
                </div>
                {{end}}
            </div>
            
            <div class="folio-canvas">
                {{.ContentHTML}}
            </div>
        </main>
    </div>
    <script>
        async function deleteArticle(slug) {
            if(!confirm('Delete this article forever?')) return;
            const res = await fetch('/api/articles/' + slug, { method: 'DELETE' });
            if(res.ok) window.location.href = '/';
        }
    </script>
</body>
</html>
