<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio</title>
    <link rel="stylesheet" href="/static/folio.css">
</head>
<body>
    <div class="folio-container">
        <header class="folio-header">
            <a href="/" class="folio-logo">Folio</a>
            <button id="publishBtn" class="folio-btn">{{if .IsEdit}}Save{{else}}Publish{{end}}</button>
        </header>

        <main>
            <input type="text" id="title" class="folio-title" placeholder="Title" value="{{if .Article}}{{.Article.Title}}{{end}}">
            <input type="text" id="author" class="folio-author" placeholder="Your name" value="{{if .Article}}{{.Article.AuthorName}}{{end}}">
            
            <div id="canvas" class="folio-canvas" contenteditable="true" placeholder="Your story...">{{if .Article}}{{.Article.ContentHTML}}{{end}}</div>
        </main>
    </div>

    <!-- Bubble Menu -->
    <div id="bubble" class="folio-bubble">
        <button class="bubble-btn" data-action="bold">B</button>
        <button class="bubble-btn" data-action="italic">I</button>
        <button class="bubble-btn" data-action="h1">H1</button>
        <button class="bubble-btn" data-action="h2">H2</button>
        <button class="bubble-btn" data-action="blockquote">”</button>
        <button class="bubble-btn" data-action="link">🔗</button>
    </div>

    {{if .IsEdit}}
    <script>
        document.getElementById('publishBtn').dataset.slug = "{{.Article.Slug}}";
    </script>
    {{end}}
    <script src="/static/folio.js"></script>
</body>
</html>
