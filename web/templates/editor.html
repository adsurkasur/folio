<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft</title>
    <link rel="stylesheet" href="/static/folio.css">
    <style>
        /* Embed placeholders */
        .embed-placeholder {
            font-style: italic;
            color: var(--text-muted);
            font-family: var(--ui-font);
        }
    </style>
</head>
<body>
    <div class="folio-container">
        <header class="folio-header">
            <button id="publishBtn" class="folio-btn">PUBLISH</button>
        </header>

        <main>
            <div class="folio-input-group">
                <input type="text" id="title" class="folio-title" placeholder="Title" value="">
                <span class="folio-label title-label">Title</span>
            </div>
            
            <div class="folio-input-group">
                <input type="text" id="author" class="folio-author" placeholder="Your name" value="">
                <span class="folio-label author-label">Author</span>
            </div>

            <!-- Media Toolbar (absolute positioned dynamically) -->
            <div id="mediaToolbar" class="folio-toolbar">
                <button class="folio-toolbar-btn" id="btnEmbed">&lt;&gt;</button>
                <button class="folio-toolbar-btn" id="btnCamera">??</button>
            </div>

            <div id="canvas" class="folio-canvas" contenteditable="true" data-placeholder="Your story..."></div>
        </main>
    </div>
    <script src="/static/folio.js"></script>
</body>
</html>
