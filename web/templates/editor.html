<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><text x=%2250%22 y=%2275%22 font-family=%22serif%22 font-style=%22italic%22 font-size=%2280%22 fill=%22white%22 text-anchor=%22middle%22>ƒ</text></svg>">
    <link rel="stylesheet" href="/static/folio.css?v=4">
</head>
<body>
    <div class="folio-container">
        <main>
            <div class="folio-top-row">
                <div class="folio-inputs">
                    <div class="folio-input-group">
                        <input type="text" id="title" class="folio-title" placeholder="Title" value="">
                        <span class="folio-label title-label">Title</span>
                    </div>
                    
                    <div class="folio-input-group">
                        <input type="text" id="author" class="folio-author" placeholder="Your name" value="">
                        <span class="folio-label author-label">Author</span>
                    </div>
                </div>
                <div class="folio-actions">
                    <button id="publishBtn" class="folio-btn">PUBLISH</button>
                    <div id="errorMsg" class="folio-error"></div>
                </div>
            </div>

            <div id="mediaToolbar" class="folio-toolbar">
                <button class="folio-toolbar-btn" id="btnEmbed">&lt;&gt;</button>
                <button class="folio-toolbar-btn" id="btnCamera">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </button>
            </div>

            <div id="canvas" class="folio-canvas" contenteditable="true" data-placeholder="Your story..."></div>
        </main>
    </div>
    <script src="/static/folio.js?v=4"></script>
</body>
</html>
